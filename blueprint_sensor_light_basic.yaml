blueprint:
  name: "Automação de Luzes com Sensor mmWave"
  description: "Automação de interruptores baseada em sensores de presença mmWave com timer regressivo"
  domain: automation
  input:
    sensor_presenca:
      name: "Sensor de Presença mmWave"
      description: "Sensor ou grupo de sensores de presença mmWave"
      selector:
        entity:
          domain: binary_sensor
          device_class: presence
    dispositivos_luz:
      name: "Dispositivos de Iluminação"
      description: "Interruptores ou luzes a serem controlados"
      selector:
        target:
          entity:
            domain: 
              - light
              - switch
    timer_segundos:
      name: "Tempo para Desligar (segundos)"
      description: "Tempo que as luzes permanecem ligadas após última detecção (10-1800s)"
      default: 60
      selector:
        number:
          min: 10
          max: 1800
          step: 10
          mode: slider
    usar_luminosidade:
      name: "Usar Condição de Luminosidade"
      description: "Ativar verificação de luminosidade ambiente"
      default: false
      selector:
        boolean:
    luminosidade_maxima:
      name: "Luminosidade Máxima para Ativação (lux)"
      description: "Valor máximo de luminosidade para acionar as luzes"
      default: 50
      selector:
        number:
          min: 5
          max: 300
          step: 5
          mode: slider
    hora_inicio:
      name: "Hora de Início"
      description: "Hora inicial para funcionamento da automação (opcional)"
      selector:
        time:
    hora_fim:
      name: "Hora de Término"
      description: "Hora final para funcionamento da automação (opcional)"
      selector:
        time:
    segunda:
      name: "Segunda-feira"
      default: true
      selector:
        boolean:
    terca:
      name: "Terça-feira"
      default: true
      selector:
        boolean:
    quarta:
      name: "Quarta-feira"
      default: true
      selector:
        boolean:
    quinta:
      name: "Quinta-feira"
      default: true
      selector:
        boolean:
    sexta:
      name: "Sexta-feira"
      default: true
      selector:
        boolean:
    sabado:
      name: "Sábado"
      default: true
      selector:
        boolean:
    domingo:
      name: "Domingo"
      default: true
      selector:
        boolean:
    entidade_controle:
      name: "Entidade de Controle Global"
      description: "Switch virtual para ativar/desativar a automação (opcional)"
      selector:
        entity:
          domain: 
            - input_boolean
            - switch
      required: false

variables:
  sensor_presenca: !input sensor_presenca
  dispositivos_luz: !input dispositivos_luz
  timer_segundos: !input timer_segundos
  usar_luminosidade: !input usar_luminosidade
  luminosidade_maxima: !input luminosidade_maxima
  hora_inicio: !input hora_inicio
  hora_fim: !input hora_fim
  segunda: !input segunda
  terca: !input terca
  quarta: !input quarta
  quinta: !input quinta
  sexta: !input sexta
  sabado: !input sabado
  domingo: !input domingo
  entidade_controle: !input entidade_controle
  timer_entity: "timer.automacao_mmwave_{{ this.automation_id }}"

trigger:
  - platform: state
    entity_id: !input sensor_presenca
    attribute: presence
    from: "false"
    to: "true"
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity

action:
  - choose:
      - conditions:
          - "{{ trigger.platform == 'state' }}"
        sequence:
          # Verificar condições para ligar as luzes
          - if:
              - condition: template
                value_template: >
                  {% set controle = entidade_controle %}
                  {% if controle %}
                    {{ is_state(controle, 'on') }}
                  {% else %}
                    true
                  {% endif %}
              - condition: template
                value_template: >
                  {% set hora_inicio_val = hora_inicio %}
                  {% set hora_fim_val = hora_fim %}
                  {% if not hora_inicio_val or not hora_fim_val %}
                    true
                  {% else %}
                    {% set now_time = now().time() %}
                    {% set start_time = strptime(hora_inicio_val, '%H:%M:%S').time() if hora_inicio_val is string else hora_inicio_val %}
                    {% set end_time = strptime(hora_fim_val, '%H:%M:%S').time() if hora_fim_val is string else hora_fim_val %}
                    {% if start_time <= end_time %}
                      {{ now_time >= start_time and now_time <= end_time }}
                    {% else %}
                      {{ now_time >= start_time or now_time <= end_time }}
                    {% endif %}
                  {% endif %}
              - condition: template
                value_template: >
                  {% set dias_selecionados = [segunda, terca, quarta, quinta, sexta, sabado, domingo] %}
                  {% set algum_dia_selecionado = dias_selecionados | select | list | length > 0 %}
                  {% if not algum_dia_selecionado %}
                    true
                  {% else %}
                    {% set dia_semana = now().weekday() %}
                    {% set dias_map = {0: segunda, 1: terca, 2: quarta, 3: quinta, 4: sexta, 5: sabado, 6: domingo} %}
                    {{ dias_map[dia_semana] }}
                  {% endif %}
              - condition: template
                value_template: >
                  {% if not usar_luminosidade %}
                    true
                  {% else %}
                    {% set sensor_state = state_attr(sensor_presenca, 'illuminance') %}
                    {% if sensor_state is not none and sensor_state | int <= luminosidade_maxima %}
                      true
                    {% else %}
                      false
                    {% endif %}
                  {% endif %}
            then:
              - service: light.turn_on
                target: !input dispositivos_luz
                data:
                  transition: 1
              - service: timer.start
                data:
                  entity_id: !input timer_entity
                  duration: !input timer_segundos
          # Se as luzes já estiverem ligadas, apenas reinicia o timer
          - else:
              - service: timer.start
                data:
                  entity_id: !input timer_entity
                  duration: !input timer_segundos
                  
      - conditions:
          - "{{ trigger.platform == 'event' and trigger.event.data.entity_id == timer_entity }}"
        sequence:
          - service: light.turn_off
            target: !input dispositivos_luz
            data:
              transition: 1
