blueprint:
  name: Sensor Light Basic Debug
  description: Versão debug para identificar problemas de ativação
  domain: automation
  input:
    presence_sensor:
      name: Sensor de Presença
      selector:
        entity:
          domain:
            - binary_sensor

    target_lights:
      name: Switches a serem acionados
      selector:
        target:
          entity:
            domain: switch

    countdown_time:
      name: Tempo para desligar (segundos)
      default: 60
      selector:
        number:
          min: 1
          max: 1800
          step: 5
          mode: slider

    only_if_dark:
      name: Habilitar conforme limite de luminosidade?
      default: false
      selector:
        boolean: {}

    lux_sensor:
      name: Sensor de luminosidade (opcional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: illuminance

    lux_limit:
      name: Limite máximo de lux para ativação (opcional)
      default: 10
      selector:
        number:
          min: 0
          max: 200
          step: 5
          mode: slider

    start_time:
      name: Hora inicial (opcional)
      description: Se vazio, funciona o dia todo.
      default: ""
      selector:
        time: {}

    end_time:
      name: Hora final (opcional)
      description: Se vazio, funciona o dia todo.
      default: ""
      selector:
        time: {}

    allowed_days:
      name: Dias permitidos (opcional)
      description: Se nenhuma opção for marcada, funcionará todos os dias.
      default: []
      selector:
        select:
          options:
            - seg
            - ter
            - qua
            - qui
            - sex
            - sab
            - dom
          multiple: true

mode: restart

trigger:
  - platform: state
    entity_id: !input presence_sensor
    to: "on"
  - platform: state
    entity_id: !input presence_sensor
    to: "off"
    for:
      seconds: !input countdown_time

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input presence_sensor
            state: "on"
          - condition: template
            value_template: >
              {% set days = allowed_days %}
              {{ (days == [] or days is none) or (now().strftime('%a').lower() in days) }}
          - condition: template
            value_template: >
              {% set start = start_time %}
              {% set end = end_time %}
              {{ (start == "" or end == "") or (now().strftime("%H:%M:%S") >= start and now().strftime("%H:%M:%S") <= end) }}
          - condition: template
            value_template: >
              {% if not only_if_dark %}
                true
              {% else %}
                {% if lux_sensor == "" or not states(lux_sensor) %}
                  true
                {% else %}
                  {{ states(lux_sensor) | float(0) <= (lux_limit | float) }}
                {% endif %}
              {% endif %}

        sequence:
          - service: switch.turn_on
            target: !input target_lights
          - service: persistent_notification.create
            data:
              title: "Sensor Light - LIGADO"
              message: >
                Sensor: {{ states(presence_sensor) }}
                Horário: {{ now().strftime('%H:%M:%S') }}
                Dia: {{ now().strftime('%a') }}

    default:
      - service: switch.turn_off
        target: !input target_lights
      - service: persistent_notification.create
        data:
          title: "Sensor Light - DESLIGADO"
          message: >
            Sensor desligou por {{ countdown_time }} segundos
