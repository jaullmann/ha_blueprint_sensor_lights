blueprint:
  name: "Sensor Lights based on mmWave and other conditions"
  description: "Aciona luzes ao detectar presença (atributo 'presence') OU acionamento manual, e as mantém acesas, reiniciando um timer de desligamento a cada nova detecção."
  domain: automation
  source_url: https://github.com/jaullmann/ha_blueprint_sensor_lights/edit/main/blueprint_sensor_light_basic.yaml
  input:
    # 1. SENSOR PRINCIPAL (OBRIGATÓRIO) - ENTIDADE QUE CONTÉM OS ATRIBUTOS
    mmwave_sensor_main: # Nome do input alterado
      name: "Entidade Principal do Sensor (Z2M)"
      description: "Entidade principal do sensor mmWave (ex: sensor.sensor_corredor) que contém os atributos 'presence' e 'illuminance'."
      selector:
        entity:
          # Permite entidades que não são binary_sensor, pois o dado é lido do atributo
          domain: 
            - binary sensor 
          multiple: true

    # 2. ILUMINAÇÃO ALVO (OBRIGATÓRIO)
    light_target:
      name: "Iluminação Alvo"
      description: "Entidade ou grupo de luzes/interruptores que serão controlados."
      selector:
        target:
          entity:
            domain: [light, switch]
      
    # 3. TIMER DE DESLIGAMENTO (OPCIONAL/DEFAULT)
    off_delay:
      name: "Tempo de Espera (s)"
      description: "Tempo (em segundos) que a luz permanecerá acesa após a última detecção de presença. (Default: 60s)"
      default: 60
      selector:
        number:
          min: 10
          max: 1800
          step: 10
          unit_of_measurement: "s"
          mode: slider

    # 4. CONDIÇÃO DE LUMINOSIDADE MÁXIMA (OPCIONAL)
    max_lux_value:
      name: "Luminosidade Máxima (Lux)"
      description: "Se o valor de luminosidade ('illuminance') for superior a este, a luz NÃO será acesa."
      default: 60
      selector:
        number:
          min: 5
          max: 300
          step: 5
          unit_of_measurement: "Lux"
          mode: slider

    # 5. CONDIÇÃO DE HORÁRIO ATIVO (OPCIONAL)
    time_after:
      name: "Horário de Início (Opcional)"
      description: "A automação só funcionará APÓS este horário."
      default: "00:00:00"
      selector:
        time:
    
    time_before:
      name: "Horário de Fim (Opcional)"
      description: "A automação só funcionará ANTES deste horário."
      default: "23:59:59"
      selector:
        time:

    # 6. CONDIÇÃO DE DIAS DA SEMANA ATIVOS (OPCIONAL)
    active_weekdays:
      name: "Dias da Semana Ativos (Opcional)"
      description: "Selecione os dias da semana em que a automação deve estar ativa."
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          options:
            - label: "Segunda-feira"
              value: mon
            - label: "Terça-feira"
              value: tue
            - label: "Quarta-feira"
              value: wed
            - label: "Quinta-feira"
              value: thu
            - label: "Sexta-feira"
              value: fri
            - label: "Sábado"
              value: sat
            - label: "Domingo"
              value: sun
          multiple: true

    # 7. CONDIÇÃO BOLEANA DE ATIVAÇÃO/DESATIVAÇÃO GERAL (OPCIONAL)
    enable_switch:
      name: "Chave Mestra de Ativação (Opcional)"
      description: "Entidade booleana que deve estar LIGADA para a automação funcionar."
      default: ""
      selector:
        entity:
          domain: [input_boolean, switch]
          multiple: false

mode: restart

# --- TRIGGERS: QUANDO A PRESENÇA OU A LUZ É ATIVADA ---
trigger:
  # Trigger 1: Detecção de Presença (Lendo o atributo 'presence' = true)
  - platform: template
    value_template: >
      {% set sensor_id = iif(is_list(input('mmwave_sensor_main')), input('mmwave_sensor_main')[0], input('mmwave_sensor_main')) %}
      {{ state_attr(sensor_id, 'presence') == true }}
    alias: "Presença Detectada (Atributo)"
    
  # Trigger 2: Acionamento Manual da Luz
  - platform: state
    entity_id: !input light_target
    from: "off"
    to: "on"
    alias: "Luz Acionada Manualmente"


# --- CONDIÇÕES DE FUNCIONAMENTO GERAL ---
condition:
  # 1. CONDIÇÃO DE LUMINOSIDADE (Lendo o atributo 'illuminance')
  - condition: template
    value_template: >
      {% set sensor_id = iif(is_list(input('mmwave_sensor_main')), input('mmwave_sensor_main')[0], input('mmwave_sensor_main')) %}
      {% set lux = state_attr(sensor_id, 'illuminance') | float(0) %}
      {{ lux <= max_lux_value | float(100) }}

  # 2. CONDIÇÃO DE HORÁRIO
  - condition: time
    after: !input time_after
    before: !input time_before
    
  # 3. CONDIÇÃO DE DIAS DA SEMANA
  - condition: time
    weekday: !input active_weekdays

  # 4. CONDIÇÃO DE CHAVE MESTRA
  - condition: template
    value_template: >
      {% set enable_id = enable_switch %}
      {% if enable_id == "" %}
        true 
      {% else %}
        {{ is_state(enable_id, 'on') }}
      {% endif %}
    alias: "Chave Mestra Ativada"

# --- AÇÃO: LIGAR A LUZ E INICIAR/REINICIAR O TIMER ---
action:
  # 1. LIGA A LUZ
  - service: "light.turn_on"
    target: !input light_target
    alias: "Ligar a Luz"

  # 2. ESPERA O TEMPO DE DELAY
  - delay: !input off_delay
    alias: "Aguardar Timer de Desligamento"

  # 3. VERIFICA NOVAMENTE A PRESENÇA NO ATRIBUTO ANTES DE DESLIGAR
  - condition: template
    value_template: >
      {% set sensor_id = iif(is_list(input('mmwave_sensor_main')), input('mmwave_sensor_main')[0], input('mmwave_sensor_main')) %}
      {{ state_attr(sensor_id, 'presence') == false }}
    alias: "Presença 'false' no final do timer"

  # 4. DESLIGA A LUZ
  - service: "light.turn_off"
    target: !input light_target
    alias: "Desligar a Luz"
